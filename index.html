<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery – The Mort Lab</title>
<link rel="icon" href="https://wp.lancs.ac.uk/mortlab/files/2019/11/cropped-logo-2-270x270.png">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { font-size: 100%; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #0d0d0d; color: #f0f0f0;
    font-family: Roboto, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 1rem; line-height: 1.65;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  a { color: #046bd2; text-decoration: none; }
  a:hover { color: #045cb4; }
  :focus-visible { outline: 2px solid #046bd2; outline-offset: 2px; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; width: 100%; }

  /* Header */
  .site-header { background: #0f0f0f; border-bottom: 1px solid #ffffff; position: relative; }
  .site-header .wrap { display: flex; align-items: center; justify-content: space-between; min-height: 80px; }
  .site-title { font-size: 1.625rem; font-weight: 600; line-height: 1.23; padding: 1em 0; margin: 0; }
  .site-title a, .site-title a:hover { color: #ffffff; }
  .main-nav ul { list-style: none; margin: 0; padding: 0; display: flex; }
  .main-nav a { display: block; padding: 0 1em; line-height: 80px; color: #ffffff; transition: color .2s linear; }
  .main-nav a:hover { color: #045cb4; }
  .main-nav a.active { color: #ffffff; }  /* WordPress menu settings keep the current item white */
  .main-nav a.active:hover { color: #045cb4; }
  .menu-toggle { display: none; background: none; border: 0; padding: 8px; margin-right: -8px; color: #046bd2; cursor: pointer; }
  .menu-toggle svg { width: 20px; height: 20px; fill: currentColor; display: block; }
  .menu-toggle .icon-close { display: none; }
  .menu-toggle[aria-expanded="true"] .icon-open { display: none; }
  .menu-toggle[aria-expanded="true"] .icon-close { display: block; }
  @media (max-width: 921.98px) {
    html { font-size: 91.2%; }
    .menu-toggle { display: block; }
    .main-nav { display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 50;
                 background: #ffffff; }
    .main-nav.open { display: block; }
    .main-nav ul { flex-direction: column; padding: 0; }
    /* As on WordPress: white dropdown, slate links, blue text on pale-blue hover/current row */
    .main-nav a, .main-nav a.active { line-height: 3; padding: 0 20px; color: #334155; }
    .main-nav a:hover, .main-nav a.active { background: #f0f5fa; color: #045cb4; }
  }

  /* Content */
  main { flex: 1 0 auto; }
  main .wrap { max-width: 1240px; padding-top: 3em; padding-bottom: 3em; }
  h1 { font-size: 2rem; font-weight: 600; line-height: 1.4; margin: 0 0 0.6em; color: #f0f0f0; }
  @media (max-width: 921.98px) { main .wrap { padding-top: 2em; } }
  .grid { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; grid-template-columns: 1fr; }
  @media (min-width: 500px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 900px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .tile {
    position: relative; display: block; width: 100%; aspect-ratio: 1 / 1; padding: 0; margin: 0;
    border: 0; border-radius: 6px; overflow: hidden; background: #000; cursor: zoom-in; color: inherit; font: inherit;
  }
  .tile img, .tile video { display: block; width: 100%; height: 100%; object-fit: cover; border: 0; transition: transform .3s; }
  .tile:hover img, .tile:hover video { transform: scale(1.03); }
  .cap {
    position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.65); color: #f0f0f0;
    text-align: center; font-size: 0.8em; padding: 0.5em; overflow-wrap: anywhere; line-height: 1.35;
  }

  /* Footer */
  footer { text-align: center; font-size: 1rem; }
  footer .wrap { min-height: 60px; display: flex; align-items: center; justify-content: center; padding-top: 1em; padding-bottom: 1em; }
  footer p { margin: 0; }

  /* Lightbox */
  .lightbox {
    position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.92); display: none;
    flex-direction: column; align-items: center; justify-content: center; padding: 48px 16px 16px;
  }
  .lightbox.open { display: flex; }
  .lightbox figure { margin: 0; max-width: 100%; max-height: 100%; display: flex; flex-direction: column; align-items: center; }
  .lightbox img, .lightbox video { max-width: 100%; max-height: calc(100vh - 160px); object-fit: contain; border-radius: 6px; }
  .lb-orig { font-size: 0.85em; margin-top: 0.4em; }
  .lightbox figcaption { margin-top: 0.75em; max-width: 60em; text-align: center; font-size: 0.95em; }
  .lb-close {
    position: absolute; top: 8px; right: 12px; background: none; border: 0; color: #f0f0f0;
    font-size: 2.2em; line-height: 1; cursor: pointer; padding: 0.1em 0.3em;
  }
  .lb-close:hover { color: #045cb4; }
  body.no-scroll { overflow: hidden; }
</style>
</head>
<body>

  <div class="wrap">

    <button type="button" class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="main-nav" aria-label="Main menu toggle">

      <svg class="icon-close" viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 2.1 10 8.6l6.5-6.5 1.4 1.4L11.4 10l6.5 6.5-1.4 1.4L10 11.4l-6.5 6.5-1.4-1.4L8.6 10 2.1 3.5z"/></svg>
    </button>
    <nav class="main-nav" id="main-nav" aria-label="Primary Site Navigation">
      <ul>
          <li><a href="http://wp.lancs.ac.uk/mortlab">Home</a></li>
          <li><a href="https://wp.lancs.ac.uk/mortlab/members/">Projects</a></li>
          <li><a href="./" class="active" aria-current="page">Gallery</a></li>
          <li><a href="https://wp.lancs.ac.uk/mortlab/publications/">Publications</a></li>
          <li><a href="https://wp.lancs.ac.uk/mortlab/resources/">Resources</a></li>
          <li><a href="https://wp.lancs.ac.uk/mortlab/mort-lab-code/">Code</a></li>
          <li><a href="https://wp.lancs.ac.uk/mortlab/r26fucci2a-applications/">Fucci</a></li>
          <li><a href="https://wp.lancs.ac.uk/mortlab/contact/">Contact</a></li>
          <li><a href="https://wp.lancs.ac.uk/mortlab/profiles/">Profiles</a></li>
          <li><a href="https://wp.lancs.ac.uk/mortlab/outreach/">Outreach</a></li>
      </ul>
    </nav>
  </div>
</header>
<main>
  <div class="wrap">
    <h1>Gallery</h1>
    <ul class="grid" id="grid">
      <li><button type="button" class="tile" data-src="images/arl13b-head.png" data-caption="Live image of developing prosencephalon of an E8.5 mouse embryo labelled with Arl13bCerulean-Fucci2a. (Mill/Ford)."><img src="images/arl13b-head.png" alt="Live image of developing prosencephalon of an E8.5 mouse embryo labelled with Arl13bCerulean-Fucci2a. (Mill/Ford)." width="512" height="512" loading="lazy" decoding="async"><span class="cap">Live image of developing prosencephalon of an E8.5 mouse embryo labelled with Arl13bCerulean-Fucci2a. (Mill/Ford).</span></button></li>
      <li><button type="button" class="tile" data-src="images/ckitl-timertag.png" data-caption="Live image of cKit-sfGFP/mCherry ‘timer tag’ labelled NIH 3T3 cells. (Olivia Harrison)"><img src="images/ckitl-timertag.png" alt="Live image of cKit-sfGFP/mCherry ‘timer tag’ labelled NIH 3T3 cells. (Olivia Harrison)" width="512" height="512" loading="lazy" decoding="async"><span class="cap">Live image of cKit-sfGFP/mCherry ‘timer tag’ labelled NIH 3T3 cells. (Olivia Harrison)</span></button></li>
      <li><button type="button" class="tile" data-src="images/fucci-tail-skin.gif" data-caption="Fucci(SA) labelled melanocytes in postnatal tail skin culture. (Richard Mort)" data-video="video/fucci-tail-skin.mp4"><video data-src="video/fucci-tail-skin.mp4" poster="video/fucci-tail-skin.jpg" width="512" height="512" muted loop playsinline preload="none" aria-label="Fucci(SA) labelled melanocytes in postnatal tail skin culture. (Richard Mort)"></video><span class="cap">Fucci(SA) labelled melanocytes in postnatal tail skin culture. (Richard Mort)</span></button></li>
      <li><button type="button" class="tile" data-src="images/h2bfucci.png" data-caption="Live imaging of H2BCerulean-Fucci2a labelled NIH 3T3 nuclei. (Stephanie Wright)"><img src="images/h2bfucci.png" alt="Live imaging of H2BCerulean-Fucci2a labelled NIH 3T3 nuclei. (Stephanie Wright)" width="512" height="512" loading="lazy" decoding="async"><span class="cap">Live imaging of H2BCerulean-Fucci2a labelled NIH 3T3 nuclei. (Stephanie Wright)</span></button></li>
      <li><button type="button" class="tile" data-src="images/hair-follicle-depth.jpg" data-caption="Depth coded stack of mouse melanoblasts as they begin to colonise a developing hair follicle at E14.5 (Richard Mort)"><img src="images/hair-follicle-depth.jpg" alt="Depth coded stack of mouse melanoblasts as they begin to colonise a developing hair follicle at E14.5 (Richard Mort)" width="512" height="517" loading="lazy" decoding="async"><span class="cap">Depth coded stack of mouse melanoblasts as they begin to colonise a developing hair follicle at E14.5 (Richard Mort)</span></button></li>
      <li><button type="button" class="tile" data-src="images/macrophages.png" data-caption="Melanocytes and macrophages in mouse tail skin (Emma Wilkinson)"><img src="images/macrophages.png" alt="Melanocytes and macrophages in mouse tail skin (Emma Wilkinson)" width="512" height="512" loading="lazy" decoding="async"><span class="cap">Melanocytes and macrophages in mouse tail skin (Emma Wilkinson)</span></button></li>

</main>
<footer>
  <div class="wrap"><p>Copyright © 2026 <a href="https://wp.lancs.ac.uk/mortlab/">The Mort Lab</a></p></div>
</footer>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
  <button type="button" class="lb-close" id="lb-close" aria-label="Close">&times;</button>
  <figure>
    <img id="lb-img" alt="">
    <video id="lb-vid" muted loop playsinline autoplay hidden></video>
    <figcaption id="lb-cap"></figcaption>
    <a id="lb-orig" class="lb-orig" hidden>Original GIF</a>
  </figure>
</div>
<script>
const SHUFFLE = true;
(function () {
  var grid = document.getElementById("grid");
  if (SHUFFLE) {
    var items = Array.prototype.slice.call(grid.children);
    for (var i = items.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = items[i]; items[i] = items[j]; items[j] = t;
    }
    items.forEach(function (li) { grid.appendChild(li); });
  }

  // Mobile menu toggle
  var toggle = document.getElementById("menu-toggle"), nav = document.getElementById("main-nav");
  toggle.addEventListener("click", function () {
    var open = toggle.getAttribute("aria-expanded") !== "true";
    toggle.setAttribute("aria-expanded", open ? "true" : "false");
    nav.classList.toggle("open", open);
  });

  // Tile videos: load when near the viewport, pause when off-screen
  var videos = grid.querySelectorAll("video[data-src]");
  function start(v) {
    if (!v.src) { v.src = v.getAttribute("data-src"); }
    var p = v.play(); if (p && p.catch) p.catch(function () {});
  }
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) start(en.target); else if (en.target.src) en.target.pause();
      });
    }, { rootMargin: "200px" });
    videos.forEach(function (v) { io.observe(v); });
  } else {
    videos.forEach(start);
  }

  // Lightbox (shows the original file, e.g. the full GIF)
  var lb = document.getElementById("lightbox"), img = document.getElementById("lb-img"),
      cap = document.getElementById("lb-cap"), vid = document.getElementById("lb-vid"),
      orig = document.getElementById("lb-orig"), closeBtn = document.getElementById("lb-close"), last = null;
  function open(btn) {
    last = btn;
    var c = btn.getAttribute("data-caption");
    var v = btn.getAttribute("data-video");
    if (v) {
      img.hidden = true; vid.hidden = false; vid.src = v;
      vid.setAttribute("aria-label", c || "Fluorescence microscopy image from the Mort Lab");
      var p = vid.play(); if (p && p.catch) p.catch(function () {});
      orig.href = btn.getAttribute("data-src"); orig.hidden = false;
    } else {
      vid.hidden = true; img.hidden = false; orig.hidden = true;
      img.src = btn.getAttribute("data-src");
      img.alt = c || "Fluorescence microscopy image from the Mort Lab";
    }
    cap.textContent = c;
    cap.hidden = !c;
    lb.hidden = false; lb.classList.add("open"); document.body.classList.add("no-scroll");
    closeBtn.focus();
  }
  function close() {
    lb.classList.remove("open"); lb.hidden = true; document.body.classList.remove("no-scroll");
    img.removeAttribute("src"); vid.pause(); vid.removeAttribute("src"); vid.load();
    if (last) last.focus();
  }
  grid.addEventListener("click", function (e) {
    var btn = e.target.closest(".tile"); if (btn) open(btn);
  });
  closeBtn.addEventListener("click", close);
  lb.addEventListener("click", function (e) { if (e.target !== img && e.target !== vid && e.target !== cap && e.target !== orig) close(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && nav.classList.contains("open") && lb.hidden) {
      toggle.click(); toggle.focus(); return;
    }
    if (lb.hidden) return;
    if (e.key === "Escape") close();
    else if (e.key === "Tab") {
      e.preventDefault();
      if (!orig.hidden && document.activeElement === closeBtn) orig.focus(); else closeBtn.focus();
    }
  });
})();
</script>
</body>
</html>
